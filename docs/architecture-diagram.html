<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZipLink · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f2f2f2;
      --color-ink:     #141414;
      --color-muted:   #5c5c5c;
      --color-accent:  #e3242b;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.4rem;
    }

    .subtitle {
      font-family: var(--font-sans);
      font-size: 0.9rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }

    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 1080px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · ZipLink</p>
    <h1>ZipLink microservice architecture</h1>
    <p class="subtitle">Two independently deployable services — a REST API and a redirect service — sit behind one frontend and share one database.</p>

    <div class="diagram-container">
      <svg viewBox="0 0 1080 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ziplink-architecture-title ziplink-architecture-desc">
        <title id="ziplink-architecture-title">ZipLink microservice architecture</title>
        <desc id="ziplink-architecture-desc">Architecture diagram showing a browser or a QR-code scan reaching the Vercel-hosted Next.js frontend, and reaching the Render-hosted redirect service directly for short links. The frontend calls a separate Render-hosted API service, which never calls the redirect service directly — the two share only the same cloud MySQL database. The API service builds short links and QR codes, and the redirect service redirects to the original URL.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5c5c5c"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#e3242b"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8a1116"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f2f2f2"/>

        <!-- Zone: Hosting (drawn before arrows and nodes) -->
        <rect x="204" y="208" width="512" height="112" rx="8"
              fill="rgba(20,20,20,0.02)" stroke="rgba(20,20,20,0.10)" stroke-width="0.8"/>
        <rect x="436" y="212" width="48" height="12" rx="2" fill="#f2f2f2"/>
        <text x="460" y="221" fill="rgba(20,20,20,0.40)" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">HOSTING</text>

        <!-- Arrows (drawn before nodes) -->

        <!-- 1. Client -> Vercel: page loads (straight, same y) -->
        <line x1="168" y1="272" x2="220" y2="272" stroke="#8a1116" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- 2. Client -> Redirect: short-link visits and QR scans land on the redirect service
             directly, routed over the top of Vercel and the api service -->
        <path d="M168,252 H200 Q208,252 208,244 V148 Q208,140 216,140 H626 Q634,140 634,148 V240"
              fill="none" stroke="#8a1116" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- 3. Vercel -> api service: the frontend's own API calls (straight, the headline flow) -->
        <line x1="352" y1="272" x2="404" y2="272" stroke="#e3242b" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- 4. api service -> MySQL (straight vertical) -->
        <line x1="512" y1="304" x2="512" y2="368" stroke="#5c5c5c" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 5. api service -> QR Code (straight vertical, dashed/optional) -->
        <line x1="412" y1="304" x2="412" y2="368" stroke="#5c5c5c" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- 6. redirect service -> MySQL (straight vertical) -->
        <line x1="592" y1="304" x2="592" y2="368" stroke="#5c5c5c" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 7. redirect service -> Original URL (fan, enters destination's bottom edge) -->
        <path d="M 700,272 H 824 Q 832,272 832,264 V 224"
              fill="none" stroke="#5c5c5c" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="174" y="252" width="40" height="12" rx="2" fill="#f2f2f2"/>
        <text x="194" y="261" fill="#8a1116" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>

        <rect x="391" y="120" width="60" height="12" rx="2" fill="#f2f2f2"/>
        <text x="421" y="129" fill="#8a1116" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET /:CODE</text>

        <rect x="354" y="252" width="48" height="12" rx="2" fill="#f2f2f2"/>
        <text x="378" y="261" fill="#e3242b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REST API</text>

        <rect x="486" y="326" width="52" height="12" rx="2" fill="#f2f2f2"/>
        <text x="512" y="335" fill="#5c5c5c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SQL · TLS</text>

        <rect x="386" y="326" width="52" height="12" rx="2" fill="#f2f2f2"/>
        <text x="412" y="335" fill="#5c5c5c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">QR PNG</text>

        <rect x="566" y="326" width="52" height="12" rx="2" fill="#f2f2f2"/>
        <text x="592" y="335" fill="#5c5c5c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SQL · TLS</text>

        <rect x="744" y="248" width="68" height="12" rx="2" fill="#f2f2f2"/>
        <text x="778" y="257" fill="#5c5c5c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">302 REDIRECT</text>

        <!-- Node: Client -->
        <rect x="40" y="240" width="128" height="64" rx="6" fill="#f2f2f2"/>
        <rect x="40" y="240" width="128" height="64" rx="6" fill="rgba(92,92,92,0.10)" stroke="#8a8a8a" stroke-width="1"/>
        <rect x="48" y="248" width="32" height="12" rx="2" fill="transparent" stroke="rgba(138,138,138,0.50)" stroke-width="0.8"/>
        <text x="64" y="257" fill="#8a8a8a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
        <text x="104" y="276" fill="#141414" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Client</text>
        <text x="104" y="292" fill="#5c5c5c" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Browser · QR scanner</text>

        <!-- Node: Vercel -->
        <rect x="220" y="240" width="132" height="64" rx="6" fill="#f2f2f2"/>
        <rect x="220" y="240" width="132" height="64" rx="6" fill="#ffffff" stroke="#141414" stroke-width="1"/>
        <rect x="228" y="248" width="28" height="12" rx="2" fill="transparent" stroke="rgba(20,20,20,0.40)" stroke-width="0.8"/>
        <text x="242" y="257" fill="#141414" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
        <text x="286" y="276" fill="#141414" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vercel</text>
        <text x="286" y="292" fill="#5c5c5c" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Next.js frontend</text>

        <!-- Node: api service (focal) -->
        <rect x="404" y="240" width="132" height="64" rx="6" fill="#f2f2f2"/>
        <rect x="404" y="240" width="132" height="64" rx="6" fill="rgba(227,36,43,0.08)" stroke="#e3242b" stroke-width="1"/>
        <rect x="412" y="248" width="28" height="12" rx="2" fill="transparent" stroke="rgba(227,36,43,0.50)" stroke-width="0.8"/>
        <text x="426" y="257" fill="#e3242b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="470" y="276" fill="#141414" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">API Service</text>
        <text x="470" y="292" fill="#5c5c5c" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">auth, links, stats</text>

        <!-- Node: redirect service (focal) -->
        <rect x="568" y="240" width="132" height="64" rx="6" fill="#f2f2f2"/>
        <rect x="568" y="240" width="132" height="64" rx="6" fill="rgba(227,36,43,0.08)" stroke="#e3242b" stroke-width="1"/>
        <rect x="576" y="248" width="28" height="12" rx="2" fill="transparent" stroke="rgba(227,36,43,0.50)" stroke-width="0.8"/>
        <text x="590" y="257" fill="#e3242b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RDR</text>
        <text x="634" y="276" fill="#141414" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Redirect Service</text>
        <text x="634" y="292" fill="#5c5c5c" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">short links · unlock</text>

        <!-- Node: Original URL -->
        <rect x="760" y="160" width="144" height="64" rx="6" fill="#f2f2f2"/>
        <rect x="760" y="160" width="144" height="64" rx="6" fill="rgba(20,20,20,0.03)" stroke="rgba(20,20,20,0.30)" stroke-width="1"/>
        <rect x="768" y="168" width="28" height="12" rx="2" fill="transparent" stroke="rgba(20,20,20,0.22)" stroke-width="0.8"/>
        <text x="782" y="177" fill="#8a8a8a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="832" y="196" fill="#141414" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Original URL</text>
        <text x="832" y="212" fill="#5c5c5c" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">any destination site</text>

        <!-- Node: MySQL Cloud -->
        <rect x="480" y="368" width="144" height="64" rx="6" fill="#f2f2f2"/>
        <rect x="480" y="368" width="144" height="64" rx="6" fill="rgba(20,20,20,0.05)" stroke="#5c5c5c" stroke-width="1"/>
        <rect x="488" y="376" width="32" height="12" rx="2" fill="transparent" stroke="rgba(92,92,92,0.50)" stroke-width="0.8"/>
        <text x="504" y="385" fill="#5c5c5c" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DATA</text>
        <text x="552" y="404" fill="#141414" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MySQL Cloud</text>
        <text x="552" y="420" fill="#5c5c5c" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">shared by both services</text>

        <!-- Node: QR Code (optional / generated on request) -->
        <rect x="352" y="368" width="120" height="56" rx="6" fill="#f2f2f2"/>
        <rect x="352" y="368" width="120" height="56" rx="6" fill="rgba(20,20,20,0.02)" stroke="rgba(20,20,20,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="360" y="376" width="28" height="12" rx="2" fill="transparent" stroke="rgba(20,20,20,0.20)" stroke-width="0.8"/>
        <text x="374" y="385" fill="#8a8a8a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GEN</text>
        <text x="412" y="400" fill="#141414" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">QR Code</text>
        <text x="412" y="416" fill="#5c5c5c" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">qrcode · PNG</text>

        <!-- Legend strip -->
        <line x1="40" y1="460" x2="1000" y2="460" stroke="rgba(20,20,20,0.10)" stroke-width="0.8"/>
        <text x="40" y="476" fill="#5c5c5c" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="492" width="14" height="10" rx="2" fill="rgba(227,36,43,0.08)" stroke="#e3242b" stroke-width="1"/>
        <text x="60" y="500" fill="#5c5c5c" font-size="8.5" font-family="'Geist', sans-serif">Core service</text>

        <rect x="180" y="492" width="14" height="10" rx="2" fill="#ffffff" stroke="#141414" stroke-width="1"/>
        <text x="200" y="500" fill="#5c5c5c" font-size="8.5" font-family="'Geist', sans-serif">Our service</text>

        <rect x="320" y="492" width="14" height="10" rx="2" fill="rgba(20,20,20,0.03)" stroke="rgba(20,20,20,0.30)" stroke-width="1"/>
        <text x="340" y="500" fill="#5c5c5c" font-size="8.5" font-family="'Geist', sans-serif">External site</text>

        <rect x="460" y="492" width="14" height="10" rx="2" fill="rgba(20,20,20,0.05)" stroke="#5c5c5c" stroke-width="1"/>
        <text x="480" y="500" fill="#5c5c5c" font-size="8.5" font-family="'Geist', sans-serif">Database</text>

        <rect x="580" y="492" width="14" height="10" rx="2" fill="rgba(20,20,20,0.02)" stroke="rgba(20,20,20,0.20)" stroke-width="1" stroke-dasharray="3,2"/>
        <text x="600" y="500" fill="#5c5c5c" font-size="8.5" font-family="'Geist', sans-serif">Async / optional</text>

        <line x1="740" y1="497" x2="768" y2="497" stroke="#8a1116" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="776" y="500" fill="#5c5c5c" font-size="8.5" font-family="'Geist', sans-serif">HTTP request</text>

        <line x1="880" y1="497" x2="908" y2="497" stroke="#e3242b" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="916" y="500" fill="#5c5c5c" font-size="8.5" font-family="'Geist', sans-serif">Primary call</text>
      </svg>
    </div>
  </div>
</body>
</html>
