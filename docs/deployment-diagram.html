<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZipLink · Deployment</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f2f2f2;
      --color-ink:     #141414;
      --color-muted:   #5c5c5c;
      --color-accent:  #e3242b;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.4rem;
    }

    .subtitle {
      font-family: var(--font-sans);
      font-size: 0.9rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }

    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 1040px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Deployment · ZipLink</p>
    <h1>ZipLink, production</h1>
    <p class="subtitle">Where each piece runs: Vercel, two Render web services, and a TiDB Serverless cluster they share.</p>

    <div class="diagram-container">
      <svg viewBox="0 0 1040 416" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ziplink-deployment-title ziplink-deployment-desc">
        <title id="ziplink-deployment-title">ZipLink, production</title>
        <desc id="ziplink-deployment-desc">Deployment diagram placing ZipLink's Next.js frontend on Vercel, its api and redirect services as two separate web services on Render, and a shared TiDB Serverless MySQL-compatible database, with a browser or QR scan reaching Vercel and the redirect service directly over HTTPS.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5c5c5c"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#e3242b"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8a1116"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f2f2f2"/>

        <!-- Zones (drawn first, before arrows and nodes) -->
        <rect x="220" y="40" width="200" height="280" rx="8" fill="rgba(20,20,20,0.02)" stroke="rgba(20,20,20,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
        <rect x="280" y="44" width="56" height="12" fill="#f2f2f2"/>
        <text x="308" y="53" fill="rgba(20,20,20,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">VERCEL</text>

        <rect x="452" y="40" width="280" height="280" rx="8" fill="rgba(20,20,20,0.02)" stroke="rgba(20,20,20,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
        <rect x="552" y="44" width="56" height="12" fill="#f2f2f2"/>
        <text x="580" y="53" fill="rgba(20,20,20,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">RENDER</text>

        <rect x="772" y="40" width="220" height="280" rx="8" fill="rgba(20,20,20,0.02)" stroke="rgba(20,20,20,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
        <rect x="852" y="44" width="52" height="12" fill="#f2f2f2"/>
        <text x="878" y="53" fill="rgba(20,20,20,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TIDB</text>

        <!-- Network paths (behind nodes) -->
        <!-- 1. Client -> Vercel (page loads) -->
        <line x1="180" y1="198" x2="244" y2="198" stroke="#8a1116" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- 2. Client -> Redirect service, routed under Vercel's zone (short-link visits, QR scans) -->
        <path d="M180,220 H212 Q220,220 220,228 V292 Q220,300 228,300 H584 Q592,300 592,292 V280"
              fill="none" stroke="#8a1116" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- 3. Vercel -> api service (the frontend's own API calls; the headline flow) -->
        <path d="M396,198 H460 Q468,198 468,190 V130 Q468,122 476,122"
              fill="none" stroke="#e3242b" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- 4. api service -> TiDB -->
        <path d="M708,122 H780 Q788,122 788,130 V182 Q788,190 796,190"
              fill="none" stroke="#8a1116" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- 5. redirect service -> TiDB -->
        <path d="M708,238 H780 Q788,238 788,230 V218 Q788,210 796,210"
              fill="none" stroke="#8a1116" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- Path labels -->
        <rect x="180" y="178" width="64" height="12" rx="2" fill="#f2f2f2"/>
        <text x="212" y="187" fill="#8a1116" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS:443</text>

        <rect x="374" y="280" width="64" height="12" rx="2" fill="#f2f2f2"/>
        <text x="406" y="289" fill="#8a1116" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS:443</text>

        <rect x="396" y="176" width="64" height="12" rx="2" fill="#f2f2f2"/>
        <text x="428" y="185" fill="#e3242b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS:443</text>

        <rect x="724" y="150" width="56" height="12" rx="2" fill="#f2f2f2"/>
        <text x="752" y="159" fill="#8a1116" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TLS:4000</text>

        <rect x="724" y="196" width="56" height="12" rx="2" fill="#f2f2f2"/>
        <text x="752" y="205" fill="#8a1116" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TLS:4000</text>

        <!-- Node: Client -->
        <rect x="40" y="156" width="140" height="84" rx="6" fill="#f2f2f2"/>
        <rect x="40" y="156" width="140" height="84" rx="6" fill="rgba(92,92,92,0.10)" stroke="#8a8a8a" stroke-width="1"/>
        <rect x="48" y="164" width="32" height="12" rx="2" fill="transparent" stroke="rgba(138,138,138,0.50)" stroke-width="0.8"/>
        <text x="64" y="173" fill="#8a8a8a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
        <text x="110" y="208" fill="#141414" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Client</text>
        <text x="110" y="224" fill="#5c5c5c" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">browser · QR scan</text>

        <!-- Node: Vercel -->
        <rect x="244" y="156" width="152" height="84" rx="6" fill="#f2f2f2"/>
        <rect x="244" y="156" width="152" height="84" rx="6" fill="#ffffff" stroke="#141414" stroke-width="1"/>
        <rect x="252" y="164" width="52" height="12" rx="2" fill="transparent" stroke="rgba(20,20,20,0.40)" stroke-width="0.8"/>
        <text x="278" y="173" fill="#141414" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MANAGED</text>
        <text x="320" y="196" fill="#141414" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">frontend</text>
        <rect x="252" y="208" width="136" height="24" rx="4" fill="rgba(20,20,20,0.05)" stroke="#5c5c5c" stroke-width="0.8"/>
        <text x="260" y="224" fill="#141414" font-size="12" font-family="'Geist', sans-serif">nextjs-app</text>
        <text x="380" y="224" fill="#5c5c5c" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">v16.4.1</text>

        <!-- Node: api service -->
        <rect x="476" y="80" width="232" height="84" rx="6" fill="#f2f2f2"/>
        <rect x="476" y="80" width="232" height="84" rx="6" fill="#ffffff" stroke="#141414" stroke-width="1"/>
        <rect x="484" y="88" width="52" height="12" rx="2" fill="transparent" stroke="rgba(20,20,20,0.40)" stroke-width="0.8"/>
        <text x="510" y="97" fill="#141414" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MANAGED</text>
        <text x="592" y="120" fill="#141414" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">api service</text>
        <rect x="484" y="132" width="216" height="24" rx="4" fill="rgba(20,20,20,0.05)" stroke="#5c5c5c" stroke-width="0.8"/>
        <text x="492" y="148" fill="#141414" font-size="12" font-family="'Geist', sans-serif">ziplink-api</text>
        <text x="692" y="148" fill="#5c5c5c" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">v1.0.0</text>

        <!-- Node: redirect service -->
        <rect x="476" y="196" width="232" height="84" rx="6" fill="#f2f2f2"/>
        <rect x="476" y="196" width="232" height="84" rx="6" fill="#ffffff" stroke="#141414" stroke-width="1"/>
        <rect x="484" y="204" width="52" height="12" rx="2" fill="transparent" stroke="rgba(20,20,20,0.40)" stroke-width="0.8"/>
        <text x="510" y="213" fill="#141414" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MANAGED</text>
        <text x="592" y="236" fill="#141414" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">redirect service</text>
        <rect x="484" y="248" width="216" height="24" rx="4" fill="rgba(20,20,20,0.05)" stroke="#5c5c5c" stroke-width="0.8"/>
        <text x="492" y="264" fill="#141414" font-size="12" font-family="'Geist', sans-serif">ziplink-redirect</text>
        <text x="692" y="264" fill="#5c5c5c" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">v1.0.0</text>

        <!-- Node: TiDB Serverless (focal — the one thing both services depend on) -->
        <rect x="796" y="156" width="176" height="84" rx="6" fill="#f2f2f2"/>
        <rect x="796" y="156" width="176" height="84" rx="6" fill="rgba(227,36,43,0.08)" stroke="#e3242b" stroke-width="1"/>
        <rect x="804" y="164" width="52" height="12" rx="2" fill="transparent" stroke="rgba(227,36,43,0.50)" stroke-width="0.8"/>
        <text x="830" y="173" fill="#e3242b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MANAGED</text>
        <text x="884" y="196" fill="#141414" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">short_url</text>
        <rect x="804" y="208" width="160" height="24" rx="4" fill="rgba(20,20,20,0.05)" stroke="#5c5c5c" stroke-width="0.8"/>
        <text x="812" y="224" fill="#141414" font-size="12" font-family="'Geist', sans-serif">tidb-serverless</text>
        <text x="956" y="224" fill="#5c5c5c" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">8.0</text>

        <!-- Legend strip -->
        <line x1="40" y1="340" x2="1000" y2="340" stroke="rgba(20,20,20,0.10)" stroke-width="0.8"/>
        <text x="40" y="356" fill="#5c5c5c" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="372" width="14" height="10" rx="2" fill="rgba(227,36,43,0.08)" stroke="#e3242b" stroke-width="1"/>
        <text x="60" y="380" fill="#5c5c5c" font-size="8.5" font-family="'Geist', sans-serif">Shared dependency</text>

        <rect x="220" y="372" width="14" height="10" rx="2" fill="#ffffff" stroke="#141414" stroke-width="1"/>
        <text x="240" y="380" fill="#5c5c5c" font-size="8.5" font-family="'Geist', sans-serif">Managed service</text>

        <rect x="380" y="372" width="14" height="10" rx="2" fill="rgba(92,92,92,0.10)" stroke="#8a8a8a" stroke-width="1"/>
        <text x="400" y="380" fill="#5c5c5c" font-size="8.5" font-family="'Geist', sans-serif">External / client</text>

        <line x1="560" y1="376" x2="588" y2="376" stroke="#8a1116" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="596" y="380" fill="#5c5c5c" font-size="8.5" font-family="'Geist', sans-serif">Cross-host call</text>

        <line x1="740" y1="376" x2="768" y2="376" stroke="#e3242b" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="776" y="380" fill="#5c5c5c" font-size="8.5" font-family="'Geist', sans-serif">Primary call</text>
      </svg>
    </div>
  </div>
</body>
</html>
