sonar.projectKey=ziplink
sonar.projectName=ZipLink
sonar.sources=backend/src,frontend/app,frontend/components,frontend/lib
sonar.tests=backend/test
sonar.exclusions=**/node_modules/**,**/.next/**
sonar.sourceEncoding=UTF-8

# Test coverage comes from the backend tests (cd backend && npm run test:coverage).
# The frontend has no automated tests yet, so it is left out of the coverage figure.
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
sonar.coverage.exclusions=frontend/**,backend/db/**,backend/src/server.js
