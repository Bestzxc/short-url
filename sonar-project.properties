sonar.projectKey=ziplink
sonar.projectName=ZipLink
sonar.sources=services/api/src,services/redirect/src,frontend/app,frontend/components,frontend/lib
sonar.tests=services/api/test,services/redirect/test,test
sonar.exclusions=**/node_modules/**,**/.next/**
sonar.sourceEncoding=UTF-8

# Test coverage comes from each service's own tests:
#   cd services/api && npm run test:coverage
#   cd services/redirect && npm run test:coverage
# The cross-service test/ suite and the frontend have no coverage report, so they're left out of
# the coverage figure (frontend has no automated tests yet; the integration suite is small by design).
sonar.javascript.lcov.reportPaths=services/api/coverage/lcov.info,services/redirect/coverage/lcov.info
sonar.coverage.exclusions=frontend/**,db/**,services/api/src/server.js,services/redirect/src/server.js,test/**
